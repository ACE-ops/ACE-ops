<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gateIntro" class="gate-intro">
        <div class="gate-bg"></div>
        <div class="gate-panel left"></div>
        <div class="gate-panel right"></div>
        <div class="gate-message">
            <h1>Welcome to Paradise</h1>
            <p>Tap to Enter</p>
        </div>
    </div>
    <div class="birthday-bg"></div>
    <div class="container">
        <img src="photo_2025-08-02_13-23-55.jpg" alt="Birthday" class="header-photo">
        <h1>🎉 Happy Birthday! 🎉</h1>
        <h2>Wishing you a day filled with love, laughter, and joy!</h2>
        <p>May all your dreams come true and may happiness always surround you. You are truly special!</p>
        <button id="wishButton">Click for a Surprise 🎁</button>
        <div id="wish" class="wish"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
